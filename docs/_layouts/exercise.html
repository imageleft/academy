---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    {% if page.description %}
    <p class="post-description">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="post-content">
    <div class="exercise-viewer">
      <!-- Tab Navigation -->
      <div class="tabs">
        <button class="tab-button active" onclick="switchTab('preview')">
          👁️ Preview
        </button>
        <button class="tab-button" onclick="switchTab('code')">
          &lt;/&gt; Code
        </button>
        {% if page.markdown_file %}
        <button class="tab-button" onclick="switchTab('markdown')">
          📝 Instructions
        </button>
        {% endif %}
      </div>

      <!-- Preview Tab -->
      <div id="preview-tab" class="tab-content active">
        <div class="preview-container">
          <iframe
            id="preview-frame"
            src="{{ page.exercise_file }}"
            title="Exercise Preview"
            sandbox="allow-scripts allow-same-origin"
          >
          </iframe>
        </div>
      </div>

      <!-- Code Tab -->
      <div id="code-tab" class="tab-content">
        <div class="code-header">
          <span class="code-filename" id="code-filename">Loading...</span>
          <button class="copy-btn" onclick="copyCode()">📋 Copy Code</button>
        </div>
        <pre><code id="code-content" class="language-html">Loading exercise code...</code></pre>
      </div>

      <!-- Markdown Instructions Tab -->
      {% if page.markdown_file %}
      <div id="markdown-tab" class="tab-content">
        <div class="markdown-content">{{ page.markdown_content }}</div>
      </div>
      {% endif %}
    </div>

    <!-- Additional Content -->
    <div class="exercise-content">{{ content }}</div>
  </div>
</article>

<style>
  .exercise-viewer {
    margin: 2rem 0;
    border: 1px solid #e1e4e8;
    border-radius: 6px;
    overflow: hidden;
  }

  .tabs {
    display: flex;
    background-color: #f6f8fa;
    border-bottom: 1px solid #e1e4e8;
    gap: 0;
  }

  .tab-button {
    flex: 1;
    padding: 12px 16px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: #586069;
    border-bottom: 3px solid transparent;
    transition: all 0.2s ease;
  }

  .tab-button:hover {
    background-color: #f3f4f6;
    color: #24292e;
  }

  .tab-button.active {
    color: #0366d6;
    border-bottom-color: #0366d6;
    background-color: #fff;
  }

  .tab-content {
    display: none;
    padding: 0;
  }

  .tab-content.active {
    display: block;
  }

  .preview-container {
    width: 100%;
    height: 600px;
    border: 1px solid #e1e4e8;
    background: #fff;
  }

  #preview-frame {
    width: 100%;
    height: 100%;
    border: none;
  }

  .code-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background-color: #f6f8fa;
    border-bottom: 1px solid #e1e4e8;
  }

  .code-filename {
    font-family: monospace;
    font-size: 13px;
    color: #586069;
    font-weight: 600;
  }

  .copy-btn {
    padding: 6px 12px;
    background-color: #28a745;
    color: white;
    border: 1px solid #28a745;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s ease;
  }

  .copy-btn:hover {
    background-color: #218838;
    border-color: #218838;
  }

  .copy-btn:active {
    background-color: #1e7e34;
  }

  #code-tab pre {
    margin: 0;
    padding: 16px;
    background-color: #f6f8fa;
    overflow-x: auto;
    max-height: 600px;
  }

  #code-tab code {
    font-family:
      "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13px;
    line-height: 1.6;
    color: #24292e;
  }

  .markdown-content {
    padding: 16px;
    font-size: 15px;
    line-height: 1.6;
  }

  .markdown-content h1,
  .markdown-content h2,
  .markdown-content h3 {
    margin-top: 1.5em;
    margin-bottom: 0.5em;
    font-weight: 600;
  }

  .markdown-content p {
    margin-bottom: 1em;
  }

  .markdown-content code {
    padding: 2px 6px;
    margin: 0 2px;
    background-color: #f6f8fa;
    border-radius: 3px;
    font-family: monospace;
    font-size: 12px;
  }

  .markdown-content pre {
    background-color: #f6f8fa;
    padding: 12px;
    border-radius: 4px;
    overflow-x: auto;
  }

  .exercise-content {
    padding: 2rem 0;
    border-top: 1px solid #e1e4e8;
    margin-top: 2rem;
  }
</style>

<script>
  // Load exercise code from file
  function loadExerciseCode() {
    const exerciseFile = "{{ page.exercise_file }}";
    const filename = exerciseFile.split("/").pop();

    document.getElementById("code-filename").textContent = filename;

    fetch(exerciseFile)
      .then((response) => response.text())
      .then((data) => {
        document.getElementById("code-content").textContent = data;
      })
      .catch((error) => {
        document.getElementById("code-content").textContent =
          "Error loading code: " + error;
      });
  }

  function switchTab(tabName) {
    // Hide all tabs
    const tabs = document.querySelectorAll(".tab-content");
    tabs.forEach((tab) => tab.classList.remove("active"));

    // Deactivate all buttons
    const buttons = document.querySelectorAll(".tab-button");
    buttons.forEach((btn) => btn.classList.remove("active"));

    // Show selected tab
    const selectedTab = document.getElementById(tabName + "-tab");
    if (selectedTab) {
      selectedTab.classList.add("active");
    }

    // Activate selected button
    event.target.classList.add("active");
  }

  function copyCode() {
    const codeContent = document.getElementById("code-content");
    const text = codeContent.textContent;

    navigator.clipboard
      .writeText(text)
      .then(() => {
        const btn = event.target;
        const originalText = btn.textContent;
        btn.textContent = "✓ Copied!";
        btn.style.backgroundColor = "#28a745";

        setTimeout(() => {
          btn.textContent = originalText;
          btn.style.backgroundColor = "";
        }, 2000);
      })
      .catch((err) => {
        console.error("Failed to copy:", err);
        alert("Failed to copy code");
      });
  }

  // Load code when page loads
  document.addEventListener("DOMContentLoaded", loadExerciseCode);
</script>
