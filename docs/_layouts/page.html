<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }} - {{ site.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}" />
    {% if site.rss_url %}
    <link
      rel="alternate"
      type="application/rss+xml"
      title="{{ site.title | xml_escape }} Feed"
      href="{{ site.rss_url | relative_url }}"
    />
    {% endif %}
  </head>

  <body>
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav">
          <a href="/">Home</a>
          <a href="/tracks/">Tracks</a>
          <a href="/exercises/">Exercises</a>
        </nav>
      </div>
    </header>

    <main class="page-content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
      </div>
    </footer>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          sans-serif;
        font-size: 16px;
        color: #333;
        background: white;
      }

      body {
        line-height: 1.6;
      }

      .wrapper {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
      }

      .site-header {
        background: white;
        border-bottom: 1px solid #e5e7eb;
        padding: 1rem 0;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .site-header .wrapper {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .site-title {
        font-size: 1.5rem;
        font-weight: 700;
        text-decoration: none;
        color: #1f2937;
      }

      .site-title:hover {
        color: #6366f1;
      }

      .site-nav {
        display: flex;
        gap: 2rem;
      }

      .site-nav a {
        text-decoration: none;
        color: #666;
        font-weight: 500;
        transition: color 0.2s;
      }

      .site-nav a:hover {
        color: #6366f1;
      }

      .page-content {
        padding: 2rem 0;
        min-height: calc(100vh - 200px);
      }

      .site-footer {
        background: #f9fafb;
        border-top: 1px solid #e5e7eb;
        padding: 2rem 0;
        margin-top: 4rem;
        text-align: center;
        color: #666;
        font-size: 0.9rem;
      }
    </style>
  </body>
</html>
